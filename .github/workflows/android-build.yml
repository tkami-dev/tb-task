name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Prebuild
        run: bunx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          cp android/app/build/outputs/apk/release/app-release.apk "tb-todo-$SHORT.apk"
          echo "APK_NAME=tb-todo-$SHORT.apk" >> "$GITHUB_ENV"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: ${{ env.APK_NAME }}

      - name: Upload updated bun.lock
        uses: actions/upload-artifact@v4
        with:
          name: bun.lock
          path: bun.lock
